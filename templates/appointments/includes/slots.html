<h2 class="small muted">{{ day|date:"l j F" }}</h2>
{% if times %}
<div class="slots">
  {% for time in times %}
  {% if reschedule %}
  <form method="post" action="{% url 'appointments:manage_reschedule' token %}">
    {% csrf_token %}
    <input type="hidden" name="start" value="{{ time.isoformat }}">
    <button type="submit" style="width: 100%">{{ time|date:"H:i" }}</button>
  </form>
  {% else %}
  <a class="button" href="{{ book_url }}?start={{ time.isoformat|urlencode }}{% if staff %}&amp;staff={{ staff.pk }}{% endif %}">{{ time|date:"H:i" }}</a>
  {% endif %}
  {% endfor %}
</div>
{% else %}
<p class="muted">No free times on this day.</p>
{% endif %}
