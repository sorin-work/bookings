<h2 class="small muted">{{ day|date:"l j F" }}</h2>
{% if times %}
<div class="slots">
  {% for time in times %}
  <a class="button" href="{{ book_url }}?start={{ time.isoformat|urlencode }}{% if staff %}&amp;staff={{ staff.pk }}{% endif %}">{{ time|date:"H:i" }}</a>
  {% endfor %}
</div>
{% else %}
<p class="muted">No free times on this day.</p>
{% endif %}
