{% if field.widget_type == "checkbox" %}
<div class="field field-checkbox{% if field.errors %} field-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
  {% if field.help_text %}<div class="helptext">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
{% else %}
<div class="field{% if field.errors %} field-error{% endif %}">
  {{ field.label_tag }}
  {{ field }}
  {% if field.help_text %}<div class="helptext">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
{% endif %}
