name: bookings

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookings}
      POSTGRES_DB: ${POSTGRES_DB:-bookings}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5446}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    # Only the web UI is published; the app reaches SMTP on the compose network.
    ports:
      - '${MAILPIT_UI_PORT:-8026}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
