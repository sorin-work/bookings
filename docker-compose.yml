name: bookings

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookings}
      POSTGRES_DB: ${POSTGRES_DB:-bookings}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5446}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bookings}:${POSTGRES_PASSWORD:-bookings}@db:5432/${POSTGRES_DB:-bookings}
      SECRET_KEY: ${SECRET_KEY:-local-docker-secret-change-me}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: http://localhost:${APP_PORT:-4406},http://127.0.0.1:${APP_PORT:-4406}
      SITE_URL: http://localhost:${APP_PORT:-4406}
      EMAIL_HOST: mailpit
      EMAIL_PORT: '1025'
      # Creates demo@example.com / demo-password with a salon and sample bookings.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - '${APP_PORT:-4406}:8000'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    # Only the web UI is published; the app reaches SMTP on the compose network.
    ports:
      - '${MAILPIT_UI_PORT:-8026}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
